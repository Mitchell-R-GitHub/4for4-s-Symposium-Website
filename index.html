<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>4for4's</title>
        <link rel="icon" type="image/png" href="images/logo.png">
        
        <!--Resume download script-->
        <script>if (confirm("Would you like a copy of our resumes?\nClicking confirm will redirect you to a new page.")) window.location.href = "resumes/resumes.pdf";</script>

        <!--AFRAME Installation-->
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
        <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.js"></script>

        <!--THREE.js Installation-->
        <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-three.prod.js"></script>
    </head>
    <body>
        <a-scene mindar-image="imageTargetSrc: mindar-assets/ta;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
            <a-assets>
                <img id="card" src="images/group-cards.png"/>
            </a-assets>

            <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
            <a-entity mindar-image-target="targetIndex: 0">
                <a-plane src="#card" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-plane>
            </a-entity>
        </a-scene>
    </body>
</html>
